<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Екі жол – екі тағдыр</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050914;color:white;font-family:Arial,sans-serif;touch-action:none}
canvas{position:fixed;inset:0;display:block}
#intro,#message{
 position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;
 justify-content:center;align-items:center;text-align:center;padding:22px;
 background:linear-gradient(135deg,#020817eF,#061a2beF);
}
h1{font-size:clamp(28px,7vw,52px);text-shadow:0 0 25px #54dfff;margin:10px}
p{max-width:650px;line-height:1.6;font-size:17px}
button{border:1px solid #ffffff88;border-radius:13px;padding:13px 19px;margin:6px;background:#163b59;color:white;font-size:15px;font-weight:bold}
button:active{transform:scale(.97)}
#start{background:#087c65}
#hud{position:fixed;z-index:3;top:12px;left:10px;right:10px;text-align:center;pointer-events:none;text-shadow:0 2px 5px black}
#sceneTitle{font-size:19px;font-weight:bold}
#sceneDesc{font-size:13px;margin-top:5px}
#next{position:fixed;z-index:4;bottom:22px;left:50%;transform:translateX(-50%);background:#087b62}
#joystick{position:fixed;z-index:4;bottom:25px;left:22px;width:120px;height:120px;border-radius:50%;background:#ffffff20;border:2px solid #ffffff66;touch-action:none}
#stick{position:absolute;width:48px;height:48px;border-radius:50%;background:#ffffffaa;left:34px;top:34px}
#hint{position:fixed;z-index:3;bottom:12px;right:12px;font-size:11px;color:#ffffffbb;text-align:right;pointer-events:none}
#doorChoices{position:fixed;z-index:4;bottom:90px;left:0;right:0;text-align:center;display:none}
#doorChoices button{font-size:13px}
#message{display:none}
.hidden{display:none!important}
@media(min-width:700px){#joystick{width:135px;height:135px}#stick{left:41px;top:41px}}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}
</script>
</head>
<body>

<div id="intro">
<h1>ЕКІ ЖОЛ – ЕКІ ТАҒДЫР</h1>
<p>Алдыңда екі түрлі өмір жолы тұр. Әр қадамың — таңдауың. Әлемге кіріп, екі тағдырды өз көзіңмен көр.</p>
<button id="start">ӘЛЕМГЕ КІРУ ▶</button>
</div>

<div id="hud" class="hidden">
<div id="sceneTitle"></div>
<div id="sceneDesc"></div>
</div>

<div id="joystick" class="hidden"><div id="stick"></div></div>
<div id="hint" class="hidden">Саусағыңмен экранды қозға — айналаға қара</div>
<button id="next" class="hidden">КЕЛЕСІ КӨРІНІС →</button>

<div id="doorChoices">
<button id="badDoor">🔴 НАШАҚОРЛЫҚ</button>
<button id="goodDoor">🟢 ЖАРҚЫН БОЛАШАҚ</button>
</div>

<div id="message">
<h1 id="endTitle"></h1>
<p id="endText"></p>
<button id="again">ҚАЙТА БАСТАУ ↻</button>
</div>

<script type="module">
import * as THREE from 'three';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x101522);
scene.fog=new THREE.Fog(0x101522,15,55);

const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,150);
camera.position.set(0,1.7,5);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x30394c,1.8));
const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(5,12,7);
sun.castShadow=true;
scene.add(sun);

let objects=[];
let current=0;
let yaw=0,pitch=0;
let moving={x:0,y:0};
let started=false;
let selected='';
let musicContext=null;

const bad=[
['АЛҒАШҚЫ ҚАДАМ','Қызығушылықпен басталған қауіпті таңдау.'],
['ТӘУЕЛДІЛІК','Есірткі адам өмірін біртіндеп бақылауға алады.'],
['АУРУХАНА','Денсаулық әлсіреп, өмірге қауіп төнеді.'],
['ЖАЛҒЫЗДЫҚ','Жақындарының сенімі мен қолдауынан айырылу.'],
['ТҮРМЕ','Қате әрекет бостандықтан айыруы мүмкін.'],
['ӨКІНІШ','Армандар орындалмай, уақыт кері қайтпайды.']
];

const good=[
['ДҰРЫС ТАҢДАУ','Нашақорлықтан бас тарту — өз болашағыңды қорғау.'],
['ДЕНСАУЛЫҚ','Спорт, күш және салауатты өмір.'],
['БІЛІМ МЕН ЕҢБЕК','Білім мен еңбек табысқа бастайды.'],
['АРМАНДАҒЫ ҮЙ','Өз үйің, көлігің және жайлы өмірің.'],
['БАҚЫТТЫ ОТБАСЫ','Жақындарыңның қуанышы мен махаббаты.'],
['САЯХАТ','Жаңа елдер, жаңа мүмкіндіктер.']
];

function add(mesh,x,y,z,cast=true){
mesh.position.set(x,y,z);
mesh.castShadow=cast;
mesh.receiveShadow=true;
scene.add(mesh);
objects.push(mesh);
return mesh;
}
function box(x,y,z,w,h,d,color,rough=.8){
return add(new THREE.Mesh(new THREE.BoxGeometry(w,h,d),
new THREE.MeshStandardMaterial({color,roughness:rough})),x,y,z);
}
function sphere(x,y,z,r,color){
return add(new THREE.Mesh(new THREE.SphereGeometry(r,18,14),
new THREE.MeshStandardMaterial({color,roughness:.7})),x,y,z);
}
function cylinder(x,y,z,r,h,color){
return add(new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,18),
new THREE.MeshStandardMaterial({color})),x,y,z);
}
function clearWorld(){
for(const o of objects){
scene.remove(o);
o.geometry?.dispose();
if(Array.isArray(o.material))o.material.forEach(m=>m.dispose());
else o.material?.dispose();
}
objects=[];
}

function light(color,intensity,x,y,z){
const l=new THREE.PointLight(color,intensity,30);
l.position.set(x,y,z);
scene.add(l);
objects.push(l);
}

function roomBase(color,floorColor){
scene.background=new THREE.Color(color);
scene.fog=new THREE.Fog(color,18,48);
box(0,-.15,-8,14,.3,32,floorColor);
box(0,4,-8,14,.3,32,color);
box(-7,2,-8,.3,4,32,color);
box(7,2,-8,.3,4,32,color);
box(0,2,-24,14,4,.3,color);
box(0,2,8,14,4,.3,color);
}

function label(text,x,y,z,color='#ffffff'){
const c=document.createElement('canvas');
c.width=1024;c.height=256;
const ctx=c.getContext('2d');
ctx.fillStyle='rgba(0,0,0,.65)';
ctx.fillRect(0,0,1024,256);
ctx.font='bold 82px Arial';
ctx.textAlign='center';ctx.textBaseline='middle';
ctx.fillStyle=color;
ctx.fillText(text,512,128,950);
const t=new THREE.CanvasTexture(c);
const m=new THREE.MeshBasicMaterial({map:t,transparent:true,side:THREE.DoubleSide});
const mesh=new THREE.Mesh(new THREE.PlaneGeometry(8,2),m);
add(mesh,x,y,z,false);
}

function bed(x,z,color=0x526477){
box(x,.55,z,3,.35,4,color);
box(x,.85,z-1.2,2.8,.35,1,0xe7e4dd);
box(x,1.1,z-1.5,2,.25,.6,0xffffff);
}
function table(x,z,color=0x6b4228){
box(x,.9,z,2,.18,1.2,color);
for(let dx of [-.8,.8])for(let dz of [-.4,.4])box(x+dx,.42,z+dz,.13,.9,.13,color);
}
function tree(x,z){
cylinder(x,1,z,.22,2,0x63402b);
sphere(x,2.4,z,.9,0x27723f);
sphere(x,3,z,.65,0x398d50);
}
function personSilhouette(x,z,color){
cylinder(x,1,z,.32,1.1,color);
sphere(x,1.85,z,.27,0xd0a17b);
}

function buildBad(n){
clearWorld();
roomBase(0x160f18,0x28222a);
light(0xff3344,30,0,3,-5);
label(bad[n][0],0,3.2,-5,'#ffb3b3');

if(n===0){
box(0,.08,-8,5,.1,12,0x4a3b35);
table(0,-0+0.8,-8);
personSilhouette(-3,-10,0x16151b);
personSilhouette(3,-13,0x24151c);
}
if(n===1){
bed(-3,-10,0x3b3037);
table(3,-9,0x302329);
for(let i=0;i<5;i++)cylinder(-2+i,-.0,-14,.12,.2,0x6e6a68);
}
if(n===2){
bed(0,-12,0xd8dce1);
box(3,1.5,-12,1.5,3,.4,0x9ba9b4);
box(-3,1.3,-12,1,2.6,.3,0x8194a1);
light(0x9acfff,18,0,3,-12);
}
if(n===3){
for(let i=0;i<3;i++)personSilhouette(-4+i*4,-12,0x22212b);
bed(0,-18,0x35313b);
}
if(n===4){
for(let x of [-4,-2,0,2,4]){
box(x,2,-12,.12,4,.12,0x777c86);
}
box(0,3,-12,10,.12,.12,0x777c86);
box(0,.1,-12,10,.12,.12,0x777c86);
}
if(n===5){
bed(0,-15,0x38313b);
table(3,-8,0x42342d);
personSilhouette(0,-10,0x29232c);
}
}

function buildGood(n){
clearWorld();
roomBase(0x8dc9ee,0x8a9b87);
light(0xffe5a1,55,0,4,-7);
label(good[n][0],0,3.2,-5,'#fff2c4');

if(n===0){
for(let x=-5;x<=5;x+=2.5)tree(x,-14);
box(0,.1,-10,3,.2,14,0x4b9b66);
}
if(n===1){
box(0,.2,-12,10,.3,14,0x398d55);
for(let x of [-3,0,3]){
cylinder(x,.4,-11,.7,.5,0xe7e7e7);
cylinder(x,1,-11,.15,1.5,0x2673a4);
}
}
if(n===2){
box(0,1.5,-13,8,3,1,0xe9e2d1);
box(0,3.2,-13,9,.5,1.5,0x285a82);
table(0,-8,0x70472b);
}
if(n===3){
box(0,1.7,-14,9,3.4,8,0xf2e5ca);
box(0,3.6,-14,10,.5,9,0x9c5540);
for(let x of [-2,2])box(x,1.8,-9,.9,1.5,.15,0x67a8d0);
box(5,.7,-5,2,1,4,0xe6b92d);
}
if(n===4){
box(0,.3,-12,9,.3,8,0x967a58);
for(let x of [-2,0,2])personSilhouette(x,-11,0x3e7354);
sphere(-2,1.8,-11,.27,0xd2a17c);
sphere(0,1.8,-11,.27,0xd2a17c);
sphere(2,1.8,-11,.27,0xd2a17c);
}
if(n===5){
for(let x of [-5,-2,2,5])tree(x,-13);
box(0,.05,-15,9,.1,10,0x3c8f62);
box(0,1,-18,2,.1,1,0xffffff);
}
}

function buildHall(){
clearWorld();
roomBase(0x171d35,0x34364c);
light(0xffd37b,100,0,5,-10);
box(0,4,-10,22,.4,24,0x242d4b);
for(let x of [-10,10]){
box(x,3,-10,.5,6,24,0x4c5270);
}
label('ЕКІ ЖОЛ. ЕКІ ТАҒДЫР.',0,5,-7,'#ffe7a3');
box(-4,2,-18,3,4,.35,0x7c2034);
box(4,2,-18,3,4,.35,0x207b5b);
box(-4,4.1,-18,3.5,.3,.6,0x9a3949);
box(4,4.1,-18,3.5,.3,.6,0x49b58c);
label('НАШАҚОРЛЫҚ',-4,2.5,-17.7,'#ffb4c2');
label('ЖАРҚЫН БОЛАШАҚ',4,2.5,-17.7,'#c5ffe3');
box(-4,1,-17.7,2.3,2,.12,0x35121f);
box(4,1,-17.7,2.3,2,.12,0x15583e);
}

function updateHUD(title,desc){
document.getElementById('sceneTitle').textContent=title;
document.getElementById('sceneDesc').textContent=desc;
}

function buildScene(){
if(current<6)buildBad(current);
else if(current<12)buildGood(current-6);
else buildHall();

if(current<6)updateHUD(bad[current][0],bad[current][1]);
else if(current<12)updateHUD(good[current-6][0],good[current-6][1]);
else updateHUD('ЕКІ ЕСІК — ЕКІ ТАҢДАУ','Екі есіктің біріне жақында. Таңдауыңды жаса.');

camera.position.set(0,1.7,5);
yaw=0;pitch=0;
camera.rotation.set(0,0,0);
document.getElementById('next').classList.toggle('hidden',current===12);
document.getElementById('doorChoices').style.display=current===12?'block':'none';
}

function finish(title,desc){
document.getElementById('message').style.display='flex';
document.getElementById('endTitle').textContent=title;
document.getElementById('endText').textContent=desc;
document.getElementById('hud').classList.add('hidden');
document.getElementById('joystick').classList.add('hidden');
document.getElementById('hint').classList.add('hidden');
document.getElementById('doorChoices').style.display='none';
}

function chooseDoor(type){
if(type==='bad'){
finish('ҚАРАҢҒЫ ЖОЛ','Нашақорлық денсаулықты, бостандықты және армандарды жояды. Бұл жолға түспе!');
}else{
finish('ЖАРҚЫН БОЛАШАҚ','Дұрыс таңдау жаса! Білім, еңбек, денсаулық және отбасы — бақытты өмірдің негізі.');
}
}

document.getElementById('start').onclick=()=>{
document.getElementById('intro').style.display='none';
['hud','joystick','hint'].forEach(id=>document.getElementById(id).classList.remove('hidden'));
started=true;
buildScene();
startMusic();
};

document.getElementById('next').onclick=()=>{
if(current<12){current++;buildScene();}
};

document.getElementById('badDoor').onclick=()=>chooseDoor('bad');
document.getElementById('goodDoor').onclick=()=>chooseDoor('good');
document.getElementById('again').onclick=()=>location.reload();

function startMusic(){
try{
musicContext=new (window.AudioContext||window.webkitAudioContext)();
const notes=[196,246.94,293.66,246.94,220,246.94];
let i=0;
function play(){
if(!started||!musicContext)return;
const osc=musicContext.createOscillator();
const gain=musicContext.createGain();
osc.type='triangle';
osc.frequency.value=notes[i%notes.length];
gain.gain.setValueAtTime(.0001,musicContext.currentTime);
gain.gain.exponentialRampToValueAtTime(.025,musicContext.currentTime+.04);
gain.gain.exponentialRampToValueAtTime(.0001,musicContext.currentTime+.65);
osc.connect(gain);gain.connect(musicContext.destination);
osc.start();osc.stop(musicContext.currentTime+.7);
i++;
setTimeout(play,750);
}
play();
}catch(e){}
}

const keys={};
addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

const joy=document.getElementById('joystick');
const stick=document.getElementById('stick');
let joyId=null;
joy.addEventListener('pointerdown',e=>{
joyId=e.pointerId;joy.setPointerCapture(e.pointerId);moveJoy(e);
});
joy.addEventListener('pointermove',e=>{if(e.pointerId===joyId)moveJoy(e)});
function moveJoy(e){
const r=joy.getBoundingClientRect();
let dx=e.clientX-(r.left+r.width/2);
let dy=e.clientY-(r.top+r.height/2);
const max=43,len=Math.hypot(dx,dy);
if(len>max){dx=dx/len*max;dy=dy/len*max;}
stick.style.left=(r.width/2-24+dx)+'px';
stick.style.top=(r.height/2-24+dy)+'px';
moving.x=dx/max;moving.y=dy/max;
}
function resetJoy(){
joyId=null;moving.x=0;moving.y=0;
stick.style.left='34px';stick.style.top='34px';
}
joy.addEventListener('pointerup',resetJoy);
joy.addEventListener('pointercancel',resetJoy);

let lookId=null,lastX=0,lastY=0;
renderer.domElement.addEventListener('pointerdown',e=>{
if(!started)return;
lookId=e.pointerId;lastX=e.clientX;lastY=e.clientY;
renderer.domElement.setPointerCapture(e.pointerId);
});
renderer.domElement.addEventListener('pointermove',e=>{
if(e.pointerId!==lookId)return;
const dx=e.clientX-lastX,dy=e.clientY-lastY;
lastX=e.clientX;lastY=e.clientY;
yaw-=dx*.004;
pitch-=dy*.004;
pitch=Math.max(-1.2,Math.min(1.2,pitch));
});
renderer.domElement.addEventListener('pointerup',()=>lookId=null);
renderer.domElement.addEventListener('pointercancel',()=>lookId=null);

function animate(){
requestAnimationFrame(animate);
if(started){
let forward=moving.y;
let side=moving.x;
if(keys.w||keys.arrowup)forward=-1;
if(keys.s||keys.arrowdown)forward=1;
if(keys.a||keys.arrowleft)side=-1;
if(keys.d||keys.arrowright)side=1;

const speed=.095;
camera.position.x+=(-Math.sin(yaw)*forward+Math.cos(yaw)*side)*speed;
camera.position.z+=(-Math.cos(yaw)*forward-Math.sin(yaw)*side)*speed;
camera.position.x=THREE.MathUtils.clamp(camera.position.x,-5.7,5.7);
camera.position.z=THREE.MathUtils.clamp(camera.position.z,-21,6);
camera.rotation.order='YXZ';
camera.rotation.y=yaw;
camera.rotation.x=pitch;

if(current===12){
const near=Math.abs(camera.position.z+18)<4;
document.getElementById('doorChoices').style.opacity=near?'1':'.45';
}
}
renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
